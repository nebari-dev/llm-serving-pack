[pytest]
markers =
    feature(id): the features.toml ID this test proves, such as "F5". Exactly one per test.
    integration: runs on --target=kind-dev
    journey: runs on --target=nebari
    release(stage): F13 upgrade test for --release-stage=before or --release-stage=after
addopts = --strict-markers
junit_family = xunit2
