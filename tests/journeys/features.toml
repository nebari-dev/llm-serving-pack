# Features the journey suite proves. The committed copy of the spec's
# Features table. IDs are stable and are never reused.
#
# known_failures: one entry per test node ID (relative to tests/journeys/),
# with a required issue, a since date, and optional targets (default: every
# target the test runs on). A listed test still runs. When adding the first
# entry, replace this empty list with [[known_failures]] tables.
known_failures = []

[F1]
title = "Install converges (all pack Argo Applications Healthy and Synced)"
tiers = ["journey"]

[F2]
title = "An LLMModel (mock vLLM) reaches Ready with both endpoint conditions True"
tiers = ["integration", "journey"]

[F3]
