name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-provider-tools:
    name: Test provider discovery and verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exercise provider adapters and shared gateway checks
        working-directory: dev/providers
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/python -m unittest discover -v

  test-operator:
    name: Test operator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Render released AI Gateway CRDs for admission checks
        run: |
          ai_gateway_crd_dir=$(mktemp -d)
          helm template aieg-crd oci://docker.io/envoyproxy/ai-gateway-crds-helm \
            --version v1.1.0 > "$ai_gateway_crd_dir/ai-gateway.yaml"
          echo "AI_GATEWAY_CRD_DIR=$ai_gateway_crd_dir" >> "$GITHUB_ENV"

      - name: Run tests
        working-directory: operator
        run: make test

  test-key-manager:
    name: Test key-manager
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: key-manager/go.mod
          cache-dependency-path: key-manager/go.sum

      - name: Run tests
        working-directory: key-manager
        run: go test ./...

  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test
