# PassthroughModel routing Bedrock Converse models through the shared endpoints.
# Region and model IDs are illustrative; availability depends on your account and region.
# The Envoy AI Gateway dataplane must have AWS workload identity configured
# (EKS Pod Identity or IRSA) with bedrock:InvokeModel and
# bedrock:InvokeModelWithResponseStream permissions. Discover and verify IDs
# for your account/region with dev/providers/provider.py --backend bedrock before applying.
apiVersion: llm.nebari.dev/v1alpha1
kind: PassthroughModel
metadata:
  name: bedrock
  namespace: nebari-llm-serving-system
spec:
  provider:
    backend:
      type: Bedrock
      bedrock:
        region: us-west-2
    credential:
      type: WorkloadIdentity
  models:
    declared:
      - us.anthropic.claude-haiku-4-5-20251001-v1:0
      - amazon.nova-lite-v1:0
      - us.meta.llama3-1-8b-instruct-v1:0
  access:
    groups:
      - llm
