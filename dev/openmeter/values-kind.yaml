# The kind cluster of the LLM serving pack's dev setup: its mock provider
# alongside Bedrock, small volumes.
modelResources:
  - {name: mock-provider, provider: mock}
  - {name: bedrock, provider: bedrock}
# The mock's token counts are tiny; prices high enough that totals read in
# cents.
prices:
  - provider: mock
    model: mock/small
    pricing: {input_per_token: "0.001", output_per_token: "0.002", cache_read_per_token: "0.0001"}
  - provider: mock
    model: mock/large
    pricing: {input_per_token: "0.003", output_per_token: "0.015", cache_read_per_token: "0.0003"}
console:
  image: {repository: docker.io/library/openmeter-console, tag: dev}
kafka: {persistence: {size: 2Gi}}
clickhouse: {persistence: {size: 2Gi}}
postgres: {persistence: {size: 1Gi}}
networkPolicy:
  apiClientNamespaces: [llm-operator-system]
