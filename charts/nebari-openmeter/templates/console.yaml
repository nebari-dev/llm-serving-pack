{{- $console := include "om.name" (dict "root" . "component" "console") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $console }}
  labels:
    {{- include "om.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      {{- include "om.selector" (dict "root" . "component" "console") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "om.labels" . | nindent 8 }}
        {{- include "om.selector" (dict "root" . "component" "console") | nindent 8 }}
    spec:
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true}
      containers:
        - name: console
          image: {{ include "om.consoleImage" . }}
          env:
            - {name: OPENMETER_URL, value: {{ printf "http://%s" (include "om.name" (dict "root" . "component" "api")) | quote }}}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          securityContext:
            {{- include "om.securityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $console }}
  labels:
    {{- include "om.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "om.selector" (dict "root" . "component" "console") | nindent 4 }}
  ports:
    - {name: http, port: 80, targetPort: http}
{{- if .Values.nebariapp.enabled }}
---
apiVersion: reconcilers.nebari.dev/v1
kind: NebariApp
metadata:
  name: {{ $console }}
  labels:
    {{- include "om.labels" . | nindent 4 }}
spec:
  hostname: {{ required "nebariapp.hostname is required when nebariapp.enabled is true" .Values.nebariapp.hostname }}
  service:
    name: {{ $console }}
    port: 80
  routing:
    routes:
      - pathPrefix: /
    tls:
      enabled: true
  {{- with .Values.nebariapp.auth }}
  {{- if .enabled }}
  auth:
    enabled: true
    provider: keycloak
    provisionClient: {{ .provisionClient }}
    enforceAtGateway: {{ .enforceAtGateway }}
  {{- end }}
  {{- end }}
  {{- with .Values.nebariapp.landingPage }}
  {{- if .enabled }}
  landingPage:
    enabled: true
    displayName: {{ .displayName | quote }}
    description: {{ .description | quote }}
    category: {{ .category }}
  {{- end }}
  {{- end }}
  gateway: {{ .Values.nebariapp.gateway }}
{{- end }}
