{{- if .Values.networkPolicy.enabled }}
{{- $sel := dict "root" . }}
# OpenMeter's API has no authentication: only the console, the bootstrap
# job and the listed namespaces (the usage collector, the key-manager) may
# call it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "om.name" (dict "root" . "component" "api") }}
  labels:
    {{- include "om.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "om.selector" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "om.selector" (dict "root" . "component" "console") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "om.selector" (dict "root" . "component" "bootstrap") | nindent 14 }}
        {{- range .Values.networkPolicy.apiClientNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - {port: 8888}
---
# The stores take connections from OpenMeter's own pods only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "om.name" (dict "root" . "component" "stores") }}
  labels:
    {{- include "om.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/instance, operator: In, values: [{{ .Release.Name }}]}
      - {key: app.kubernetes.io/component, operator: In, values: [kafka, clickhouse, postgres, redis]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nebari-openmeter
              app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
