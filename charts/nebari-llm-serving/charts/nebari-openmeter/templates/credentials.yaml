{{- /*
Passwords for the bundled Postgres and ClickHouse. Made once with random
values; an upgrade keeps the ones already in the cluster.
*/ -}}
{{- $name := include "om.name" (dict "root" . "component" "credentials") -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $pg := randAlphaNum 32 -}}
{{- $ch := randAlphaNum 32 -}}
{{- if $existing }}
{{- $pg = index $existing.data "postgres-password" | b64dec -}}
{{- $ch = index $existing.data "clickhouse-password" | b64dec -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "om.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ $pg | quote }}
  clickhouse-password: {{ $ch | quote }}
  postgres-url: {{ printf "postgres://postgres:%s@%s:5432/postgres?sslmode=disable" $pg (include "om.name" (dict "root" . "component" "postgres")) | quote }}
