{{- /*
The bundled ClickHouse's password. Made once with a random value; an upgrade
keeps the one already in the cluster. Postgres credentials come from
CloudNativePG (database.yaml).
*/ -}}
{{- $name := include "om.name" (dict "root" . "component" "credentials") -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $ch := randAlphaNum 32 -}}
{{- if $existing }}
{{- $ch = index $existing.data "clickhouse-password" | b64dec -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "om.labels" . | nindent 4 }}
type: Opaque
stringData:
  clickhouse-password: {{ $ch | quote }}
