{{- /*
The bundled ClickHouse's password and the key OpenMeter encrypts app secrets
with: clickhouse.existingSecret and openmeter.secretEncryption.existingSecret,
or Secrets this Job creates once with 32 random bytes (hex) and never changes.
They are made in the cluster, not in the chart: Argo CD renders charts with helm template,
where lookup finds nothing, so a value made in the chart would change on
every sync. Postgres credentials come from CloudNativePG (database.yaml).

Ordinary resources, not a pre-install hook: hooks run before the release's
other resources, so in the pack's namespace a hook would run before the pack
creates that namespace. Until the Job has made the Secret, the pods that read
it wait in CreateContainerConfigError, which Kubernetes retries. A Job's pod
template can't be changed, so the name carries a hash of the rendered pod, as
the price-sync Job's does: any change to it makes a new Job in place of the
old one.
*/ -}}
{{- define "om.ensureSecretPod" }}
{{- $root := .root }}
metadata:
  labels:
    {{- include "om.selector" (dict "root" $root "component" "ensure-secret") | nindent 4 }}
spec:
  serviceAccountName: {{ include "om.name" (dict "root" $root "component" "ensure-secret") }}
  restartPolicy: Never
  enableServiceLinks: false
  securityContext: {runAsNonRoot: true}
  containers:
    {{- range .secrets }}
    - name: {{ .key }}
      image: {{ include "om.setupImage" $root }}
      command: ["/openmeter-setup", "ensure-secret", "-name", {{ .name | quote }}, "-key", {{ .key | quote }}]
      securityContext:
        {{- include "om.securityContext" $root | nindent 8 }}
        readOnlyRootFilesystem: true
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 64Mi}
    {{- end }}
{{- end }}
{{- $secrets := list }}
{{- if not .Values.clickhouse.existingSecret }}
{{- $secrets = append $secrets (dict "name" (include "om.clickhouseSecret" .) "key" "clickhouse-password") }}
{{- end }}
{{- if not .Values.openmeter.secretEncryption.existingSecret }}
{{- $secrets = append $secrets (dict "name" (include "om.secretEncryptionSecret" .) "key" "secret-encryption-key") }}
{{- end }}
{{- if $secrets }}
{{- $name := include "om.name" (dict "root" . "component" "ensure-secret") }}
{{- $pod := include "om.ensureSecretPod" (dict "root" . "secrets" $secrets) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "om.namespace" $ }}
  labels:
    {{- include "om.labels" . | nindent 4 }}
---
# Create only: the Job can't read, change or delete any Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ include "om.namespace" $ }}
  labels:
    {{- include "om.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ include "om.namespace" $ }}
  labels:
    {{- include "om.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ include "om.namespace" $ }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "om.name" (dict "root" . "component" (printf "ensure-secret-%s" ($pod | sha256sum | trunc 10))) }}
  namespace: {{ include "om.namespace" $ }}
  labels:
    {{- include "om.labels" . | nindent 4 }}
spec:
  backoffLimit: 3
  template:
    {{- $pod | nindent 4 }}
{{- end }}
