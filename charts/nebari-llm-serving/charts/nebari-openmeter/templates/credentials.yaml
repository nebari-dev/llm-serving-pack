{{- /*
The bundled ClickHouse's password: clickhouse.existingSecret, or a Secret
this Job creates once with a random password and never changes. It is made
in the cluster, not in the chart: Argo CD renders charts with helm template,
where lookup finds nothing, so a password made in the chart would change on
every sync. Postgres credentials come from CloudNativePG (database.yaml).

Ordinary resources, not a pre-install hook: hooks run before the release's
other resources, so in the pack's namespace a hook would run before the pack
creates that namespace. Until the Job has made the Secret, the pods that read
it wait in CreateContainerConfigError, which Kubernetes retries. A Job's pod
template can't be changed, so the name carries a hash of the spec, and a new
image makes a new Job in place of the old one.
*/ -}}
{{- if not .Values.clickhouse.existingSecret }}
{{- $name := include "om.name" (dict "root" . "component" "ensure-secret") }}
{{- $command := list "/openmeter-setup" "ensure-secret" "-name" (include "om.clickhouseSecret" .) "-key" "clickhouse-password" }}
{{- $job := printf "%s-%s" ($name | trunc 57 | trimSuffix "-") (printf "%s %s" (include "om.setupImage" .) ($command | join " ") | sha256sum | trunc 5) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "om.namespace" $ }}
  labels:
    {{- include "om.labels" . | nindent 4 }}
---
# Create only: the Job can't read, change or delete any Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ include "om.namespace" $ }}
  labels:
    {{- include "om.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ include "om.namespace" $ }}
  labels:
    {{- include "om.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ include "om.namespace" $ }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $job }}
  namespace: {{ include "om.namespace" $ }}
  labels:
    {{- include "om.labels" . | nindent 4 }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "om.selector" (dict "root" . "component" "ensure-secret") | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true}
      containers:
        - name: ensure-secret
          image: {{ include "om.setupImage" . }}
          command: {{ toJson $command }}
          securityContext:
            {{- include "om.securityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
{{- end }}
