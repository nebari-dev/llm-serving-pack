{{- /*
The bundled ClickHouse's password: clickhouse.existingSecret, or a Secret
this hook creates once with a random password and never changes. It is made
in the cluster, not in the chart: Argo CD renders charts with helm template,
where lookup finds nothing, so a password made in the chart would change on
every sync. Postgres credentials come from CloudNativePG (database.yaml).
*/ -}}
{{- if not .Values.clickhouse.existingSecret }}
{{- $name := include "om.name" (dict "root" . "component" "ensure-secret") }}
{{- $hook := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "om.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-10") $hook) | nindent 4 }}
---
# Create only: the hook can't read, change or delete any Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "om.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-10") $hook) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "om.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-10") $hook) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "om.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-5") $hook) | nindent 4 }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "om.selector" (dict "root" . "component" "ensure-secret") | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true}
      containers:
        - name: ensure-secret
          image: {{ include "om.consoleImage" . }}
          command: ["/openmeter-api", "ensure-secret", "-name", {{ include "om.clickhouseSecret" . | quote }}, "-key", "clickhouse-password"]
          securityContext:
            {{- include "om.securityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
{{- end }}
