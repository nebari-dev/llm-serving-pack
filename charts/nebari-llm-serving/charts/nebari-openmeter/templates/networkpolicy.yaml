{{- if .Values.networkPolicy.enabled }}
# OpenMeter's API has no authentication: only the console, the bootstrap
# job, pods in this namespace with one of apiClientPodLabels, and the listed
# namespaces may call it. As a subchart of the LLM serving pack, the parent
# chart adds a second policy for its clients in the operator namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "om.name" (dict "root" . "component" "api") }}
  labels:
    {{- include "om.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "om.selector" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "om.selector" (dict "root" . "component" "console") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "om.selector" (dict "root" . "component" "bootstrap") | nindent 14 }}
        {{- range .Values.networkPolicy.apiClientPodLabels }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
        {{- range .Values.networkPolicy.apiClientNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - {port: 8888}
---
# The console shows everyone's usage: it takes connections from the
# gateway's Envoy proxies only, which sign people in first (NebariApp).
# kubectl port-forward still reaches it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "om.name" (dict "root" . "component" "console") }}
  labels:
    {{- include "om.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "om.selector" (dict "root" . "component" "console") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
      ports:
        - {port: 8080}
---
# The stores take connections from OpenMeter's own pods only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "om.name" (dict "root" . "component" "stores") }}
  labels:
    {{- include "om.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/instance, operator: In, values: [{{ .Release.Name }}]}
      - {key: app.kubernetes.io/component, operator: In, values: [kafka, clickhouse, redis]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nebari-openmeter
              app.kubernetes.io/instance: {{ .Release.Name }}
---
# Postgres takes connections from OpenMeter's pods, its own instances, and
# the CloudNativePG operator, which manages it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "om.name" (dict "root" . "component" "db") }}
  labels:
    {{- include "om.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ include "om.name" (dict "root" . "component" "db") }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nebari-openmeter
              app.kubernetes.io/instance: {{ .Release.Name }}
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "om.name" (dict "root" . "component" "db") }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.postgres.operatorNamespace }}
{{- end }}
