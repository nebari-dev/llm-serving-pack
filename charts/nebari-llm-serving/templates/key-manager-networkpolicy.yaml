{{- if .Values.usage.enabled }}
{{- $collector := printf "%s-usage-collector" (include "nebari-llm-serving.fullname" .) }}
# The lookup answers for any key without auth: only the collector may call it.
# Always on with usage.enabled, whatever usage.collector.networkPolicy says:
# that flag opens the collector's OTLP port, and must not open this one too.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nebari-llm-serving.fullname" . }}-key-owners
  namespace: {{ include "nebari-llm-serving.operatorNamespace" . }}
  labels:
    {{- include "nebari-llm-serving.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "nebari-llm-serving.fullname" . }}-key-manager
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app: {{ $collector }}
      ports:
        - port: key-owners
          protocol: TCP
{{- end }}
