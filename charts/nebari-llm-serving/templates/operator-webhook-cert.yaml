apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "nebari-llm-serving.fullname" . }}-webhook-cert
  namespace: {{ include "nebari-llm-serving.operatorNamespace" . }}
  labels:
    {{- include "nebari-llm-serving.labels" . | nindent 4 }}
spec:
  secretName: {{ include "nebari-llm-serving.fullname" . }}-webhook-cert
  dnsNames:
    - {{ include "nebari-llm-serving.fullname" . }}-webhook-service.{{ include "nebari-llm-serving.operatorNamespace" . }}.svc
    - {{ include "nebari-llm-serving.fullname" . }}-webhook-service.{{ include "nebari-llm-serving.operatorNamespace" . }}.svc.cluster.local
  issuerRef:
    {{- /* The dig fallback covers values reused from releases without
    operator.webhook. Keep it in sync with operator.webhook.clusterIssuer in
    values.yaml. */}}
    name: {{ required "operator.webhook.clusterIssuer is required: name an existing cert-manager ClusterIssuer to sign the operator webhook certificate" (dig "webhook" "clusterIssuer" "nebari-ca-issuer" .Values.operator) | quote }}
    kind: ClusterIssuer
